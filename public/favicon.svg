<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3F1C" />
      <stop offset="70%" stop-color="#0E1E0C" />
      <stop offset="100%" stop-color="#060C05" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EFE0" />
      <stop offset="50%" stop-color="#D3C9AC" />
      <stop offset="100%" stop-color="#8F8362" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#76FF03" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
  </defs>

  <!-- Circular Base (Perfect round badge, no square corners) -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)" />

  <!-- Luxury Ring Borders -->
  <circle cx="256" cy="256" r="238" fill="none" stroke="url(#gold)" stroke-width="8" />
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#neon)" stroke-width="3" opacity="0.85" />
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="5 7" opacity="0.6" />

  <!-- Crest Stars -->
  <polygon points="256,76 261,89 274,89 263,97 267,110 256,102 245,110 249,97 238,89 251,89" fill="url(#gold)" />
  <polygon points="120,256 123,264 131,264 125,269 127,277 120,272 113,277 115,269 109,264 117,264" fill="url(#gold)" opacity="0.8" />
  <polygon points="392,256 395,264 403,264 397,269 399,277 392,272 385,277 387,269 381,264 389,264" fill="url(#gold)" opacity="0.8" />

  <!-- Inner Disc -->
  <circle cx="256" cy="256" r="176" fill="#091408" stroke="url(#gold)" stroke-width="3.5" />

  <!-- "000" in upper center -->
  <text x="256" y="210" text-anchor="middle" font-family="'Times New Roman', serif" font-weight="bold" font-size="94" fill="url(#gold)" letter-spacing="4">000</text>

  <!-- Divider Line with Diamond -->
  <line x1="140" y1="238" x2="372" y2="238" stroke="url(#gold)" stroke-width="2.5" opacity="0.75" />
  <polygon points="256,232 263,238 256,244 249,238" fill="url(#neon)" />

  <!-- "GREEN" in lower center -->
  <text x="256" y="318" text-anchor="middle" font-family="'Times New Roman', serif" font-weight="bold" font-size="74" fill="url(#gold)" letter-spacing="12">GREEN</text>

  <!-- Subtitle -->
  <text x="256" y="360" text-anchor="middle" font-family="monospace" font-size="18" fill="#9BD08A" letter-spacing="8" opacity="0.9">EST. 2026</text>
</svg>
