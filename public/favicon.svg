<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#143012" />
      <stop offset="60%" stop-color="#091807" />
      <stop offset="100%" stop-color="#020602" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="35%" stop-color="#E5DCBF" />
      <stop offset="70%" stop-color="#BAAF8C" />
      <stop offset="100%" stop-color="#807554" />
    </linearGradient>

    <!-- Electric Neon Green Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#76FF03" />
      <stop offset="50%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#76FF03" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Clip to Perfect Circle (ensures no square edges anywhere) -->
  <clipPath id="circleClip">
    <circle cx="256" cy="256" r="252" />
  </clipPath>

  <g clip-path="url(#circleClip)">
    <!-- Base Background Circle -->
    <circle cx="256" cy="256" r="256" fill="url(#bgGrad)" />

    <!-- Outer Precision Bezel -->
    <circle cx="256" cy="256" r="244" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
    <circle cx="256" cy="256" r="234" fill="none" stroke="url(#neonGrad)" stroke-width="2.5" opacity="0.9" />

    <!-- Digital Watch Index Ticks around dial -->
    <!-- 12 o'clock -->
    <rect x="253" y="24" width="6" height="18" rx="2" fill="url(#neonGrad)" />
    <!-- 3 o'clock -->
    <rect x="470" y="253" width="18" height="6" rx="2" fill="url(#goldGrad)" />
    <!-- 6 o'clock -->
    <rect x="253" y="470" width="6" height="18" rx="2" fill="url(#neonGrad)" />
    <!-- 9 o'clock -->
    <rect x="24" y="253" width="18" height="6" rx="2" fill="url(#goldGrad)" />

    <!-- Additional Index Dots -->
    <circle cx="366" cy="98" r="4" fill="url(#goldGrad)" opacity="0.75" />
    <circle cx="414" cy="146" r="4" fill="url(#goldGrad)" opacity="0.75" />
    <circle cx="414" cy="366" r="4" fill="url(#goldGrad)" opacity="0.75" />
    <circle cx="366" cy="414" r="4" fill="url(#goldGrad)" opacity="0.75" />
    <circle cx="146" cy="414" r="4" fill="url(#goldGrad)" opacity="0.75" />
    <circle cx="98" cy="366" r="4" fill="url(#goldGrad)" opacity="0.75" />
    <circle cx="98" cy="146" r="4" fill="url(#goldGrad)" opacity="0.75" />
    <circle cx="146" cy="98" r="4" fill="url(#goldGrad)" opacity="0.75" />

    <!-- Inner Shield Disc -->
    <circle cx="256" cy="256" r="198" fill="#060E05" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="256" cy="256" r="190" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.6" />

    <!-- Top Crown Icon / Stars -->
    <polygon points="256,86 261,97 273,97 263,104 267,115 256,108 245,115 249,104 239,97 251,97" fill="url(#goldGrad)" />
    <circle cx="222" cy="100" r="2.5" fill="url(#neonGrad)" />
    <circle cx="290" cy="100" r="2.5" fill="url(#neonGrad)" />

    <!-- THE "000" ICONIC LOGOTYPE (Ultra-Bold, Serif & Precision Curved) -->
    <g filter="url(#neonGlow)">
      <!-- Left 0 -->
      <ellipse cx="178" cy="204" rx="34" ry="50" fill="none" stroke="url(#goldGrad)" stroke-width="16" />
      <ellipse cx="178" cy="204" rx="20" ry="34" fill="#060E05" />

      <!-- Center 0 (Prominent & Crowned) -->
      <ellipse cx="256" cy="198" rx="38" ry="56" fill="none" stroke="url(#neonGrad)" stroke-width="18" />
      <ellipse cx="256" cy="198" rx="22" ry="38" fill="#060E05" />

      <!-- Right 0 -->
      <ellipse cx="334" cy="204" rx="34" ry="50" fill="none" stroke="url(#goldGrad)" stroke-width="16" />
      <ellipse cx="334" cy="204" rx="20" ry="34" fill="#060E05" />
    </g>

    <!-- Cyber Horizontal Divider Bar with Diamond -->
    <line x1="110" y1="268" x2="236" y2="268" stroke="url(#goldGrad)" stroke-width="3" />
    <polygon points="256,260 264,268 256,276 248,268" fill="url(#neonGrad)" />
    <line x1="276" y1="268" x2="402" y2="268" stroke="url(#goldGrad)" stroke-width="3" />

    <!-- "GREEN" Wordmark (Bold Serif Luxury Branding) -->
    <text
      x="256"
      y="340"
      text-anchor="middle"
      font-family="'Times New Roman', 'Cinzel', serif"
      font-weight="900"
      font-size="68"
      letter-spacing="14"
      fill="url(#goldGrad)"
    >GREEN</text>

    <!-- Subtitle Pill / Quality Seal -->
    <rect x="176" y="374" width="160" height="24" rx="12" fill="#132B11" stroke="url(#neonGrad)" stroke-width="1.5" />
    <text
      x="256"
      y="390"
      text-anchor="middle"
      font-family="monospace, sans-serif"
      font-weight="bold"
      font-size="12"
      letter-spacing="4"
      fill="#76FF03"
    >CYBER • TIME</text>
  </g>
</svg>
